<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d6e5a">
<title>Mi Punto de Venta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --verde:#0d6e5a; --verde2:#0a5a49; --bg:#f2f4f5; --card:#ffffff;
    --txt:#16211f; --muted:#6b7a77; --linea:#e3e8e7; --azul:#1462b8;
    --rojo:#c0392b; --amar:#f5b301;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt);
    padding-bottom:120px; overscroll-behavior-y:contain;
  }
  header{
    background:var(--verde); color:#fff; padding:14px 14px;
    padding-top:calc(14px + env(safe-area-inset-top,0));
    position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .h-row{display:flex; align-items:center; gap:8px;}
  header h1{font-size:18px; margin:0; font-weight:700;}
  .h-sub{font-size:11.5px; opacity:.85; margin-top:2px;}
  .hbtn{background:rgba(255,255,255,.16); border:none; color:#fff; font-size:12px;
    padding:8px 10px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .hbtn.on{background:var(--amar); color:#3a2c00;}
  .sync-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#9fb3ae; margin-right:5px; vertical-align:1px;}
  .sync-dot.ok{background:#7ee2a8;} .sync-dot.syncing{background:var(--amar); animation:pulse 1s infinite;}
  .sync-dot.error{background:#ff8b7d;} .sync-dot.offline{background:#c9d4d1;}
  @keyframes pulse{50%{opacity:.3;}}

  .searchbar{padding:12px 12px 6px;}
  .searchbar-wrap{display:flex; gap:8px;}
  #q{flex:1; font-size:17px; padding:14px; border:2px solid var(--linea); border-radius:14px; background:#fff; outline:none;}
  #q:focus{border-color:var(--verde);}
  .scanbtn{background:var(--verde); color:#fff; border:none; border-radius:14px; padding:0 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:66px;}
  .scanbtn span{font-size:22px;} .scanbtn small{font-size:11px; font-weight:700;}
  .toolrow{display:flex; gap:8px; padding:4px 12px 8px; align-items:center;}
  .toolrow .count{font-size:12px; color:var(--muted); flex:1;}
  .minibtn{background:#fff; border:1px solid var(--linea); color:var(--verde); font-weight:700;
    font-size:12.5px; padding:8px 12px; border-radius:20px;}

  #list{padding:0 12px;}
  .card{background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; align-items:center; gap:10px;}
  .card .info{flex:1; min-width:0;}
  .card .nombre{font-size:15.5px; font-weight:600; line-height:1.25;}
  .card .meta{font-size:11.5px; color:var(--muted); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tag{background:#eef3f1; color:#456; padding:2px 7px; border-radius:6px; font-size:10.5px;}
  .tag.edit{background:#fff3d1; color:#8a6a00;}
  .tag.nuevo{background:#d9f0e6; color:#0a5a49;}
  .exist{font-weight:600;} .exist.cero{color:var(--rojo);}
  .precios{text-align:right; white-space:nowrap;}
  .venta{font-size:21px; font-weight:800; color:var(--verde); line-height:1;}
  .mayoreo{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .costo{font-size:11.5px; color:var(--azul); margin-top:2px; font-weight:600; display:none;}
  body.show-costo .costo{display:block;}
  .cardbtns{display:flex; flex-direction:column; gap:6px;}
  .addbtn{background:var(--verde); color:#fff; border:none; width:44px; height:40px; border-radius:11px; font-size:24px; font-weight:700; line-height:1;}
  .editbtn{background:#eef3f1; color:#456; border:none; width:44px; height:30px; border-radius:11px; font-size:14px;}
  .empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:15px;}
  .empty b{color:var(--txt);}

  #ventaBar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--verde); color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0)); display:flex; align-items:center; gap:12px;
    box-shadow:0 -3px 12px rgba(0,0,0,.18);}
  #ventaBar .vb-info{flex:1;}
  #ventaBar .vb-count{font-size:12.5px; opacity:.9;}
  #ventaBar .vb-total{font-size:26px; font-weight:800; line-height:1.1;}
  #ventaBar .vb-open{background:#fff; color:var(--verde); border:none; font-weight:700; padding:12px 16px; border-radius:12px; font-size:15px;}
  #ventaBar.hidden{display:none;}

  /* hojas deslizables */
  .sheetwrap{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:none; align-items:flex-end;}
  .sheetwrap.open{display:flex;}
  .sheet{background:var(--bg); width:100%; max-height:92vh; border-radius:20px 20px 0 0; display:flex; flex-direction:column; animation:up .22s;}
  @keyframes up{from{transform:translateY(100%);}}
  .sheet-head{padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--linea); background:#fff; border-radius:20px 20px 0 0;}
  .sheet-head h2{margin:0; font-size:17px; flex:1;}
  .closex{background:#e3e8e7; border:none; width:36px; height:36px; border-radius:50%; font-size:19px; flex-shrink:0;}
  .sheet-body{overflow-y:auto; padding:14px; flex:1;}
  .sheet-foot{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0)); background:#fff; border-top:1px solid var(--linea);}

  .ci{background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .ci .ci-n{flex:1; font-size:14px; line-height:1.2;}
  .ci .ci-n small{color:var(--muted); font-size:11px; display:block;}
  .qtybox{display:flex; align-items:center; background:#eef3f1; border-radius:10px;}
  .qtybox button{width:34px; height:34px; border:none; background:transparent; font-size:20px; font-weight:700; color:var(--verde);}
  .qtybox span{min-width:26px; text-align:center; font-weight:700; font-size:15px;}
  .ci .ci-sub{min-width:62px; text-align:right; font-weight:700; font-size:14.5px;}
  .totalrow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .totalrow .t-lbl{font-size:16px; color:var(--muted);}
  .totalrow .t-val{font-size:32px; font-weight:800; color:var(--verde);}
  .pago{display:flex; gap:10px; align-items:center; margin-bottom:8px;}
  .pago label{font-size:14px; color:var(--muted); flex:1;}
  .pago input{width:120px; font-size:18px; padding:10px; border:2px solid var(--linea); border-radius:10px; text-align:right;}
  .cambio{text-align:right; font-size:15px; margin-bottom:12px; min-height:20px;}
  .cambio b{font-size:21px; color:var(--azul);}
  .foot-btns{display:flex; gap:10px;}
  .foot-btns button{flex:1; padding:15px; border:none; border-radius:12px; font-size:16px; font-weight:700;}
  .btn-clear{background:#f3d9d6; color:var(--rojo);}
  .btn-done{background:var(--verde); color:#fff;}

  /* formulario */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input{width:100%; font-size:16px; padding:12px; border:2px solid var(--linea); border-radius:11px; background:#fff;}
  .field input:focus{border-color:var(--verde); outline:none;}
  .f2{display:flex; gap:10px;} .f2 .field{flex:1;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:-6px; margin-bottom:12px;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap;}
  .btnrow button{flex:1; min-width:120px; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700;}
  .b-save{background:var(--verde); color:#fff;}
  .b-rest{background:#e3e8e7; color:#456;}
  .b-del{background:#f3d9d6; color:var(--rojo);}
  .warn{background:#fff3d1; color:#7a5c00; padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.45; margin-bottom:12px;}
  .okbox{background:#d9f0e6; color:#0a5a49; padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.45; margin-bottom:12px;}
  .statline{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--linea); font-size:14px;}
  .statline b{font-weight:700;}
  ol.pasos{margin:0 0 12px; padding-left:20px; font-size:13px; line-height:1.7; color:#3c4a47;}
  ol.pasos code{background:#eef3f1; padding:1px 5px; border-radius:4px; font-size:12px;}

  /* escáner */
  #scanView{position:fixed; inset:0; z-index:50; background:#000; display:none; flex-direction:column;}
  #scanView.open{display:flex;}
  .scan-top{color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top,0)); display:flex; align-items:center; gap:10px; background:rgba(0,0,0,.5);}
  .scan-top h2{margin:0; font-size:16px; flex:1;}
  #reader{flex:1; width:100%;}
  #reader video{object-fit:cover;}
  .scan-msg{color:#fff; text-align:center; padding:12px; font-size:15px; background:rgba(0,0,0,.6); min-height:20px;}
  .flash{animation:fl .5s;}
  @keyframes fl{0%{background:#0d6e5a;}100%{background:rgba(0,0,0,.6);}}

  .toast{position:fixed; bottom:150px; left:50%; transform:translateX(-50%); background:#222; color:#fff;
    padding:12px 18px; border-radius:24px; font-size:14.5px; z-index:35; opacity:0; transition:.2s;
    pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.3); max-width:88%; text-align:center;}
  .toast.show{opacity:1;}
  .toast.ok{background:var(--verde);} .toast.err{background:var(--rojo);}
</style>
</head>
<body>
<header>
  <div class="h-row">
    <div style="flex:1; min-width:0;">
      <h1>🛒 Mi Punto de Venta</h1>
      <div class="h-sub" id="hsub">Cargando…</div>
    </div>
    <button class="hbtn" id="lockBtn">🔒</button>
    <button class="hbtn" id="cfgBtn">⚙️</button>
  </div>
</header>

<div class="searchbar">
  <div class="searchbar-wrap">
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Buscar producto o código…">
    <button class="scanbtn" id="openScan"><span>📷</span><small>Escanear</small></button>
  </div>
</div>
<div class="toolrow">
  <span class="count" id="count"></span>
  <button class="minibtn" id="newProdBtn">＋ Nuevo producto</button>
  <button class="minibtn" id="cajaBtn">📊 Hoy</button>
</div>
<div id="list"></div>

<div id="ventaBar" class="hidden">
  <div class="vb-info">
    <div class="vb-count" id="vbCount">0 productos</div>
    <div class="vb-total" id="vbTotal">$0.00</div>
  </div>
  <button class="vb-open" id="openCart">Ver venta ▸</button>
</div>

<!-- Carrito -->
<div id="cartSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2>🧾 Venta actual</h2><button class="closex" data-close="cartSheet">✕</button></div>
    <div class="sheet-body" id="cartItems"></div>
    <div class="sheet-foot">
      <div class="totalrow"><span class="t-lbl">TOTAL</span><span class="t-val" id="cartTotal">$0.00</span></div>
      <div class="pago"><label>¿Con cuánto paga?</label><input id="paga" type="number" inputmode="decimal" placeholder="$"></div>
      <div class="cambio" id="cambio"></div>
      <div class="foot-btns">
        <button class="btn-clear" id="clearCart">🗑 Cancelar</button>
        <button class="btn-done" id="doneCart">✓ Cobrado</button>
      </div>
    </div>
  </div>
</div>

<!-- Editar / Nuevo producto -->
<div id="editSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2 id="editTitle">✏️ Editar producto</h2><button class="closex" data-close="editSheet">✕</button></div>
    <div class="sheet-body">
      <div id="editNote"></div>
      <div class="field"><label>Nombre del producto</label><input id="f_n" type="text"></div>
      <div class="field" id="wrap_c"><label>Código (de barras o clave tuya)</label><input id="f_c" type="text"></div>
      <div class="f2">
        <div class="field"><label>Precio de venta</label><input id="f_v" type="number" inputmode="decimal" step="0.01"></div>
        <div class="field"><label>Precio mayoreo</label><input id="f_m" type="number" inputmode="decimal" step="0.01"></div>
      </div>
      <div class="f2">
        <div class="field"><label>Costo (lo que te costó)</label><input id="f_co" type="number" inputmode="decimal" step="0.01"></div>
        <div class="field"><label>Piezas que quedan</label><input id="f_e" type="number" inputmode="decimal" step="1"></div>
      </div>
      <div class="field"><label>Departamento</label><input id="f_d" type="text"></div>
    </div>
    <div class="sheet-foot">
      <div class="btnrow">
        <button class="b-save" id="saveProd">✓ Guardar</button>
        <button class="b-rest" id="restProd">↩ Original</button>
        <button class="b-del" id="delProd">🗑 Borrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Corte del día -->
<div id="cajaSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2>📊 Ventas de hoy</h2><button class="closex" data-close="cajaSheet">✕</button></div>
    <div class="sheet-body" id="cajaBody"></div>
  </div>
</div>

<!-- Ajustes / nube -->
<div id="cfgSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2>⚙️ Ajustes y nube</h2><button class="closex" data-close="cfgSheet">✕</button></div>
    <div class="sheet-body" id="cfgBody"></div>
  </div>
</div>

<!-- Escáner -->
<div id="scanView">
  <div class="scan-top"><h2>📷 Escanea el código</h2><button class="closex" id="closeScan" style="background:#fff;">✕</button></div>
  <div id="reader"></div>
  <div class="scan-msg" id="scanMsg">Apunta al código de barras</div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
