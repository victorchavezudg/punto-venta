<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d6e5a">
<title>Mi Punto de Venta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --verde:#0d6e5a; --verde2:#0a5a49; --bg:#f2f4f5; --card:#ffffff;
    --txt:#16211f; --muted:#6b7a77; --linea:#e3e8e7; --azul:#1462b8;
    --rojo:#c0392b; --amar:#f5b301;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt);
    padding-bottom:120px; overscroll-behavior-y:contain;
  }
  header{
    background:var(--verde); color:#fff; padding:14px 14px calc(14px + env(safe-area-inset-top,0));
    padding-top:calc(14px + env(safe-area-inset-top,0));
    position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .h-row{display:flex; align-items:center; gap:10px;}
  header h1{font-size:19px; margin:0; font-weight:700; flex:1;}
  .h-sub{font-size:12px; opacity:.85; margin-top:2px;}
  .lock{background:rgba(255,255,255,.16); border:none; color:#fff; font-size:12px;
    padding:7px 10px; border-radius:20px; font-weight:600;}
  .lock.on{background:var(--amar); color:#3a2c00;}
  .searchbar{padding:12px 12px 6px; position:sticky; top:0; z-index:15;}
  .searchbar-wrap{display:flex; gap:8px;}
  #q{
    flex:1; font-size:17px; padding:14px 14px; border:2px solid var(--linea);
    border-radius:14px; background:#fff; outline:none;
  }
  #q:focus{border-color:var(--verde);}
  .scanbtn{
    background:var(--verde); color:#fff; border:none; border-radius:14px;
    padding:0 16px; font-size:15px; font-weight:700; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:66px;
  }
  .scanbtn span{font-size:22px;}
  .scanbtn small{font-size:11px;}
  .count{padding:2px 14px 8px; font-size:12px; color:var(--muted);}
  #list{padding:0 12px;}
  .card{
    background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; align-items:center; gap:12px;
  }
  .card .info{flex:1; min-width:0;}
  .card .nombre{font-size:15.5px; font-weight:600; line-height:1.25;}
  .card .meta{font-size:11.5px; color:var(--muted); margin-top:3px;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .tag{background:#eef3f1; color:#456; padding:2px 7px; border-radius:6px; font-size:10.5px;}
  .exist{font-weight:600;}
  .exist.cero{color:var(--rojo);}
  .precios{text-align:right; white-space:nowrap;}
  .venta{font-size:22px; font-weight:800; color:var(--verde); line-height:1;}
  .mayoreo{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .costo{font-size:11.5px; color:var(--azul); margin-top:2px; font-weight:600; display:none;}
  body.show-costo .costo{display:block;}
  .addbtn{
    background:var(--verde); color:#fff; border:none; width:46px; height:46px;
    border-radius:12px; font-size:26px; font-weight:700; flex-shrink:0; line-height:1;
  }
  .addbtn:active{background:var(--verde2);}
  .empty{text-align:center; color:var(--muted); padding:50px 20px; font-size:15px;}
  .empty b{color:var(--txt);}

  /* Barra de venta abajo */
  #ventaBar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--verde); color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0));
    display:flex; align-items:center; gap:12px; box-shadow:0 -3px 12px rgba(0,0,0,.18);
  }
  #ventaBar .vb-info{flex:1;}
  #ventaBar .vb-count{font-size:12.5px; opacity:.9;}
  #ventaBar .vb-total{font-size:26px; font-weight:800; line-height:1.1;}
  #ventaBar .vb-open{background:#fff; color:var(--verde); border:none; font-weight:700;
    padding:12px 16px; border-radius:12px; font-size:15px;}
  #ventaBar.hidden{transform:translateY(120%); transition:.25s;}

  /* Panel de venta (carrito) */
  #cartSheet{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45);
    display:none; align-items:flex-end;
  }
  #cartSheet.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-height:88vh; border-radius:20px 20px 0 0;
    display:flex; flex-direction:column; animation:up .25s;
  }
  @keyframes up{from{transform:translateY(100%);}}
  .sheet-head{padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--linea);}
  .sheet-head h2{margin:0; font-size:18px; flex:1;}
  .closex{background:#e3e8e7; border:none; width:36px; height:36px; border-radius:50%; font-size:20px;}
  .cart-items{overflow-y:auto; padding:10px 14px; flex:1;}
  .ci{background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .ci .ci-n{flex:1; font-size:14px; line-height:1.2;}
  .ci .ci-n small{color:var(--muted); font-size:11px; display:block;}
  .qtybox{display:flex; align-items:center; gap:0; background:#eef3f1; border-radius:10px;}
  .qtybox button{width:34px; height:34px; border:none; background:transparent; font-size:20px; font-weight:700; color:var(--verde);}
  .qtybox span{min-width:26px; text-align:center; font-weight:700; font-size:15px;}
  .ci .ci-sub{min-width:64px; text-align:right; font-weight:700; font-size:14.5px;}
  .sheet-foot{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0)); background:#fff; border-top:1px solid var(--linea);}
  .totalrow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .totalrow .t-lbl{font-size:16px; color:var(--muted);}
  .totalrow .t-val{font-size:34px; font-weight:800; color:var(--verde);}
  .pago{display:flex; gap:10px; align-items:center; margin-bottom:10px;}
  .pago label{font-size:14px; color:var(--muted); flex:1;}
  .pago input{width:120px; font-size:18px; padding:10px; border:2px solid var(--linea); border-radius:10px; text-align:right;}
  .cambio{text-align:right; font-size:16px; margin-bottom:12px; min-height:22px;}
  .cambio b{font-size:22px; color:var(--azul);}
  .foot-btns{display:flex; gap:10px;}
  .foot-btns button{flex:1; padding:15px; border:none; border-radius:12px; font-size:16px; font-weight:700;}
  .btn-clear{background:#f3d9d6; color:var(--rojo);}
  .btn-done{background:var(--verde); color:#fff;}

  /* Escáner */
  #scanView{position:fixed; inset:0; z-index:50; background:#000; display:none; flex-direction:column;}
  #scanView.open{display:flex;}
  .scan-top{color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top,0)); display:flex; align-items:center; gap:10px; background:rgba(0,0,0,.5);}
  .scan-top h2{margin:0; font-size:17px; flex:1;}
  #reader{flex:1; width:100%;}
  .scan-msg{color:#fff; text-align:center; padding:12px; font-size:15px; background:rgba(0,0,0,.6); min-height:20px;}
  #reader video{object-fit:cover;}
  .flash{animation:fl .5s;}
  @keyframes fl{0%{background:#0d6e5a;}100%{background:rgba(0,0,0,.6);}}

  .toast{position:fixed; bottom:150px; left:50%; transform:translateX(-50%); background:#222; color:#fff;
    padding:12px 18px; border-radius:24px; font-size:14.5px; z-index:35; opacity:0; transition:.2s; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.3); max-width:88%; text-align:center;}
  .toast.show{opacity:1;}
  .toast.ok{background:var(--verde);}
  .toast.err{background:var(--rojo);}
</style>
</head>
<body>
<header>
  <div class="h-row">
    <div style="flex:1">
      <h1>🛒 Mi Punto de Venta</h1>
      <div class="h-sub" id="hsub">Cargando productos…</div>
    </div>
    <button class="lock" id="lockBtn" title="Ver costo">🔒 Costo</button>
  </div>
</header>

<div class="searchbar">
  <div class="searchbar-wrap">
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Buscar producto o código…">
    <button class="scanbtn" id="openScan"><span>📷</span><small>Escanear</small></button>
  </div>
</div>
<div class="count" id="count"></div>
<div id="list"></div>

<!-- Barra de venta -->
<div id="ventaBar" class="hidden">
  <div class="vb-info">
    <div class="vb-count" id="vbCount">0 productos</div>
    <div class="vb-total" id="vbTotal">$0.00</div>
  </div>
  <button class="vb-open" id="openCart">Ver venta ▸</button>
</div>

<!-- Carrito -->
<div id="cartSheet">
  <div class="sheet">
    <div class="sheet-head">
      <h2>🧾 Venta actual</h2>
      <button class="closex" id="closeCart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="sheet-foot">
      <div class="totalrow"><span class="t-lbl">TOTAL</span><span class="t-val" id="cartTotal">$0.00</span></div>
      <div class="pago">
        <label>¿Con cuánto paga?</label>
        <input id="paga" type="number" inputmode="decimal" placeholder="$">
      </div>
      <div class="cambio" id="cambio"></div>
      <div class="foot-btns">
        <button class="btn-clear" id="clearCart">🗑 Nueva venta</button>
        <button class="btn-done" id="doneCart">✓ Cobrado</button>
      </div>
    </div>
  </div>
</div>

<!-- Escáner -->
<div id="scanView">
  <div class="scan-top">
    <h2>📷 Escanea el código de barras</h2>
    <button class="closex" id="closeScan" style="background:#fff;">✕</button>
  </div>
  <div id="reader"></div>
  <div class="scan-msg" id="scanMsg">Apunta al código de barras del producto</div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
