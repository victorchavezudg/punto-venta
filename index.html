<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d6e5a">
<title>Punto de Venta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --verde:#0d6e5a; --verde2:#0a5a49; --bg:#f2f4f5; --card:#ffffff;
    --txt:#16211f; --muted:#6b7a77; --linea:#e3e8e7; --azul:#1462b8;
    --rojo:#c0392b; --amar:#f5b301;
    --cart-w:400px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt);
    display:flex; flex-direction:column; min-height:100%;
    overscroll-behavior-y:contain;
  }

  /* ---------- encabezado ---------- */
  header{
    background:var(--verde); color:#fff; padding:12px 14px;
    padding-top:calc(12px + env(safe-area-inset-top,0));
    flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.12); z-index:25;
  }
  .h-row{display:flex; align-items:center; gap:8px; max-width:1600px; margin:0 auto; width:100%;}
  header h1{font-size:17px; margin:0; font-weight:700; line-height:1.15;}
  .h-sub{font-size:11.5px; opacity:.85; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbtn{background:rgba(255,255,255,.16); border:none; color:#fff; font-size:13px;
    padding:9px 11px; border-radius:20px; font-weight:600; white-space:nowrap; cursor:pointer;}
  .hbtn:hover{background:rgba(255,255,255,.26);}
  .hbtn.on{background:var(--amar); color:#3a2c00;}
  .sync-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#9fb3ae; margin-right:5px; vertical-align:1px;}
  .sync-dot.ok{background:#7ee2a8;} .sync-dot.syncing{background:var(--amar); animation:pulse 1s infinite;}
  .sync-dot.error{background:#ff8b7d;} .sync-dot.offline{background:#c9d4d1;}
  @keyframes pulse{50%{opacity:.3;}}

  /* ---------- estructura ---------- */
  .app{flex:1; display:flex; flex-direction:column; min-height:0; width:100%;}
  .pane-list{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0;}

  .searchbar{padding:12px 12px 6px;}
  .searchbar-wrap{display:flex; gap:8px;}
  #q{flex:1; font-size:17px; padding:14px; border:2px solid var(--linea); border-radius:14px; background:#fff; outline:none;}
  #q:focus{border-color:var(--verde);}
  .scanbtn{background:var(--verde); color:#fff; border:none; border-radius:14px; padding:0 16px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:66px;}
  .scanbtn span{font-size:22px;} .scanbtn small{font-size:11px; font-weight:700;}
  .toolrow{display:flex; gap:8px; padding:4px 12px 8px; align-items:center; flex-wrap:wrap;}
  .toolrow .count{font-size:12px; color:var(--muted); flex:1; min-width:70px;}
  .minibtn{background:#fff; border:1px solid var(--linea); color:var(--verde); font-weight:700; cursor:pointer;
    font-size:12.5px; padding:9px 13px; border-radius:20px;}
  .minibtn:hover{border-color:var(--verde);}

  #list{padding:0 12px 12px; overflow-y:auto; flex:1;}
  .card{background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; align-items:center; gap:10px; cursor:pointer;}
  .card:hover{box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .card.sel{outline:3px solid var(--verde); outline-offset:-1px;}
  .card .info{flex:1; min-width:0;}
  .card .nombre{font-size:15.5px; font-weight:600; line-height:1.25;}
  .card .meta{font-size:11.5px; color:var(--muted); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tag{background:#eef3f1; color:#456; padding:2px 7px; border-radius:6px; font-size:10.5px;}
  .tag.edit{background:#fff3d1; color:#8a6a00;}
  .tag.nuevo{background:#d9f0e6; color:#0a5a49;}
  .exist{font-weight:600;} .exist.cero{color:var(--rojo);}
  .precios{text-align:right; white-space:nowrap;}
  .venta{font-size:21px; font-weight:800; color:var(--verde); line-height:1;}
  .mayoreo{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .costo{font-size:11.5px; color:var(--azul); margin-top:2px; font-weight:600; display:none;}
  body.show-costo .costo{display:block;}
  .cardbtns{display:flex; flex-direction:column; gap:6px;}
  .addbtn{background:var(--verde); color:#fff; border:none; width:44px; height:40px; border-radius:11px;
    font-size:24px; font-weight:700; line-height:1; cursor:pointer;}
  .addbtn:hover{background:var(--verde2);}
  .editbtn{background:#eef3f1; color:#456; border:none; width:44px; height:30px; border-radius:11px; font-size:14px; cursor:pointer;}
  .empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:15px;}
  .empty b{color:var(--txt);}

  /* ---------- CANASTA (siempre visible) ---------- */
  .pane-cart{background:#fff; display:flex; flex-direction:column; min-height:0;}
  .cart-head{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--linea);
    background:var(--verde); color:#fff; flex-shrink:0;}
  .cart-head h2{margin:0; font-size:16px; flex:1; font-weight:700;}
  .cart-head .cc{background:rgba(255,255,255,.22); padding:3px 10px; border-radius:20px; font-size:12.5px; font-weight:700;}
  .cart-items{overflow-y:auto; padding:10px 12px; flex:1; min-height:0;}
  .cart-vacio{text-align:center; color:var(--muted); padding:22px 12px; font-size:14px; line-height:1.5;}

  .ci{background:#f7f9f8; border-radius:12px; padding:9px 11px; margin-bottom:7px; display:flex; align-items:center; gap:9px;}
  .ci .ci-n{flex:1; min-width:0; font-size:14px; line-height:1.25;}
  .ci .ci-n small{color:var(--muted); font-size:11.5px; display:block; margin-top:1px;}
  .qtybox{display:flex; align-items:center; background:#fff; border:1px solid var(--linea); border-radius:10px;}
  .qtybox button{width:32px; height:32px; border:none; background:transparent; font-size:19px; font-weight:700; color:var(--verde); cursor:pointer;}
  .qtybox span{min-width:24px; text-align:center; font-weight:700; font-size:15px;}
  .ci .ci-sub{min-width:62px; text-align:right; font-weight:700; font-size:14.5px;}

  .cart-foot{border-top:1px solid var(--linea); padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));
    flex-shrink:0; background:#fff;}
  .totalrow{display:flex; justify-content:space-between; align-items:baseline;}
  .totalrow .t-lbl{font-size:15px; color:var(--muted); font-weight:600;}
  .totalrow .t-val{font-size:34px; font-weight:800; color:var(--verde); line-height:1.1;}
  .subrow{font-size:12.5px; color:var(--muted); text-align:right; min-height:15px;}
  .subrow b{color:var(--rojo);}

  .descrow{display:flex; align-items:center; gap:9px; margin:10px 0 8px;}
  .descrow .d-lbl{font-size:13.5px; color:var(--muted); flex:1;}
  .dgroup{display:flex; align-items:center; gap:6px;}
  .dtipo{width:36px; height:38px; border:2px solid var(--linea); background:#fff; color:var(--muted);
    border-radius:10px; font-size:15px; font-weight:800; cursor:pointer;}
  .dtipo.activo{background:var(--verde); color:#fff; border-color:var(--verde);}
  .dgroup input{width:82px; font-size:16px; padding:9px; border:2px solid var(--linea); border-radius:10px; text-align:right;}

  .formas{display:flex; gap:6px; margin-bottom:8px;}
  .forma{flex:1; padding:10px 3px; border:2px solid var(--linea); background:#fff; color:var(--muted);
    border-radius:10px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .forma.activo{background:var(--verde); color:#fff; border-color:var(--verde);}
  .clirow{display:flex; align-items:center; gap:9px; margin-bottom:8px; background:#fff8e1; padding:9px 11px; border-radius:10px;}
  .clirow span{flex:1; font-size:13.5px; font-weight:600;}
  .pago{display:flex; gap:10px; align-items:center; margin-bottom:6px;}
  .pago label{font-size:13.5px; color:var(--muted); flex:1;}
  .pago input{width:118px; font-size:17px; padding:9px; border:2px solid var(--linea); border-radius:10px; text-align:right;}
  .cambio{text-align:right; font-size:14.5px; margin-bottom:10px; min-height:19px;}
  .cambio b{font-size:20px; color:var(--azul);}
  .foot-btns{display:flex; gap:9px;}
  .foot-btns button{flex:1; padding:15px 8px; border:none; border-radius:12px; font-size:15.5px; font-weight:700; cursor:pointer;}
  .btn-clear{background:#f3d9d6; color:var(--rojo); flex:0 0 62px;}
  .btn-apart{background:#fff3d1; color:#8a6a00;}
  .btn-done{background:var(--verde); color:#fff;}
  .btn-done:hover{background:var(--verde2);}
  #cobrarMovil{display:none; width:100%; padding:16px; border:none; border-radius:12px;
    background:var(--verde); color:#fff; font-size:17px; font-weight:800; margin-top:10px; cursor:pointer;}

  /* ================= CELULAR ================= */
  @media (max-width:899px){
    .app{padding-bottom:0;}
    .pane-cart{
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      border-top:3px solid var(--verde); box-shadow:0 -4px 18px rgba(0,0,0,.16);
      max-height:52vh;
    }
    .cart-items{max-height:26vh;}
    body{padding-bottom:270px;}
    body.cart-vacia{padding-bottom:118px;}
    body.cart-vacia .cart-items{max-height:none;}
    body.cart-vacia .cart-vacio{padding:10px 12px; font-size:13px;}
    #payBoxHost .descrow, #payBoxHost .formas, #payBoxHost .clirow,
    #payBoxHost .pago, #payBoxHost .cambio, #payBoxHost .foot-btns{}
    #cobrarMovil{display:block;}
    .cart-foot .payinline{display:none;}
  }
  /* ============ TABLET Y PC ============ */
  @media (min-width:900px){
    .app{flex-direction:row; overflow:hidden;}
    .pane-list{overflow:hidden;}
    .pane-cart{width:var(--cart-w); flex-shrink:0; border-left:1px solid var(--linea); height:100%;}
    .searchbar{padding:16px 16px 6px; max-width:none;}
    #q{font-size:18px; padding:15px;}
    #list{padding:0 16px 16px;}
    .card{padding:13px 15px;}
    body{padding-bottom:0; height:100vh; overflow:hidden;}
    .cart-items{max-height:none;}
    .totalrow .t-val{font-size:40px;}
  }
  @media (min-width:1400px){
    :root{--cart-w:460px;}
    .card .nombre{font-size:16.5px;}
    .venta{font-size:23px;}
  }

  /* ---------- hojas deslizables ---------- */
  .sheetwrap{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:none; align-items:flex-end;}
  .sheetwrap.open{display:flex;}
  .sheet{background:var(--bg); width:100%; max-height:92vh; border-radius:20px 20px 0 0; display:flex; flex-direction:column; animation:up .22s;}
  @media (min-width:900px){
    .sheetwrap{align-items:center; justify-content:center;}
    .sheet{max-width:620px; border-radius:18px; max-height:88vh; animation:pop .18s;}
    @keyframes pop{from{transform:scale(.96); opacity:0;}}
  }
  @keyframes up{from{transform:translateY(100%);}}
  .sheet-head{padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--linea); background:#fff; border-radius:18px 18px 0 0;}
  .sheet-head h2{margin:0; font-size:17px; flex:1;}
  .closex{background:#e3e8e7; border:none; width:36px; height:36px; border-radius:50%; font-size:19px; flex-shrink:0; cursor:pointer;}
  .sheet-body{overflow-y:auto; padding:14px; flex:1;}
  .sheet-foot{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0)); background:#fff; border-top:1px solid var(--linea);}

  /* ---------- formularios y paneles ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input{width:100%; font-size:16px; padding:12px; border:2px solid var(--linea); border-radius:11px; background:#fff;}
  .field input:focus{border-color:var(--verde); outline:none;}
  .f2{display:flex; gap:10px;} .f2 .field{flex:1;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:-6px; margin-bottom:12px; line-height:1.45;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap;}
  .btnrow button{flex:1; min-width:120px; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;}
  .b-save{background:var(--verde); color:#fff;}
  .b-rest{background:#e3e8e7; color:#456;}
  .b-del{background:#f3d9d6; color:var(--rojo);}
  .warn{background:#fff3d1; color:#7a5c00; padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.45; margin-bottom:12px;}
  .okbox{background:#d9f0e6; color:#0a5a49; padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.45; margin-bottom:12px;}
  .statline{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--linea); font-size:14px;}
  ol.pasos{margin:0 0 12px; padding-left:20px; font-size:13px; line-height:1.7; color:#3c4a47;}
  ol.pasos code{background:#eef3f1; padding:1px 5px; border-radius:4px; font-size:12px;}
  .menu-item{display:flex; align-items:center; gap:14px; background:#fff; border:none; width:100%; cursor:pointer;
    padding:16px; border-radius:14px; margin-bottom:10px; text-align:left; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .menu-item .mi-ico{font-size:24px; width:32px; text-align:center;}
  .menu-item .mi-txt{flex:1; min-width:0;}
  .menu-item .mi-tit{display:block; font-size:16px; font-weight:700; color:var(--txt); line-height:1.25;}
  .menu-item .mi-sub{display:block; font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.3;}
  .menu-item .mi-bad{background:var(--verde); color:#fff; font-size:12px; font-weight:700; padding:4px 9px; border-radius:20px;}
  .menu-item .mi-bad.rojo{background:var(--rojo);} .menu-item .mi-bad.amar{background:var(--amar); color:#3a2c00;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{padding:8px 13px; border:2px solid var(--linea); background:#fff; color:var(--muted); border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer;}
  .chip.activo{background:var(--verde); color:#fff; border-color:var(--verde);}
  .kpi{display:flex; gap:10px; margin-bottom:12px;}
  .kpi > div{flex:1; background:#fff; border-radius:12px; padding:12px; text-align:center;}
  .kpi .k-lbl{font-size:11px; color:var(--muted);}
  .kpi .k-val{font-size:20px; font-weight:800; color:var(--verde); margin-top:3px;}
  .kpi .k-val.azul{color:var(--azul);} .kpi .k-val.rojo{color:var(--rojo);}
  .row-item{background:#fff; border-radius:12px; padding:11px 13px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .row-item .ri-t{flex:1; min-width:0;}
  .row-item .ri-n{font-size:14.5px; font-weight:600; line-height:1.25;}
  .row-item .ri-s{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .row-item .ri-v{text-align:right; white-space:nowrap; font-weight:700; font-size:15px;}
  .row-item .ri-v.rojo{color:var(--rojo);} .row-item .ri-v.verde{color:var(--verde);}
  .badge{display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px;}
  .badge.abierto{background:#fff3d1; color:#8a6a00;}
  .badge.entregado{background:#d9f0e6; color:#0a5a49;}
  .badge.cancelado{background:#f3d9d6; color:#c0392b;}

  /* ---------- escáner ---------- */
  #scanView{position:fixed; inset:0; z-index:50; background:#000; display:none; flex-direction:column;}
  #scanView.open{display:flex;}
  .scan-top{color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top,0)); display:flex; align-items:center; gap:10px; background:rgba(0,0,0,.5);}
  .scan-top h2{margin:0; font-size:16px; flex:1;}
  #reader{flex:1; width:100%;}
  #reader video{object-fit:cover;}
  .scan-msg{color:#fff; text-align:center; padding:12px; font-size:15px; background:rgba(0,0,0,.6); min-height:20px;}
  .flash{animation:fl .5s;}
  @keyframes fl{0%{background:#0d6e5a;}100%{background:rgba(0,0,0,.6);}}

  .toast{position:fixed; left:50%; transform:translateX(-50%); background:#222; color:#fff;
    padding:11px 17px; border-radius:24px; font-size:14px; z-index:60; opacity:0; transition:.2s;
    pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.3); max-width:86%; text-align:center;
    top:auto; bottom:calc(52vh + 14px);}
  body.cart-vacia .toast{bottom:130px;}
  @media (min-width:900px){
    .toast{left:20px; right:auto; transform:none; bottom:20px; max-width:min(420px,45vw); text-align:left;}
    body.cart-vacia .toast{bottom:20px;}
  }
  .toast.show{opacity:1;}
  .toast.ok{background:var(--verde);} .toast.err{background:var(--rojo);}

  .kbd{display:none;}
  @media (min-width:900px){
    .kbd{display:inline-block; background:#eef3f1; color:#6b7a77; border:1px solid var(--linea);
      border-radius:5px; padding:1px 5px; font-size:10.5px; font-weight:700; margin-left:6px;}
  }
</style>
</head>
<body>

<header>
  <div class="h-row">
    <div style="flex:1; min-width:0;">
      <h1 id="hTitulo">🛒 Punto de Venta</h1>
      <div class="h-sub" id="hsub">Cargando…</div>
    </div>
    <button class="hbtn" id="lockBtn" title="Mostrar/ocultar costo">🔒</button>
    <button class="hbtn" id="masBtn" title="Más opciones">☰ Más</button>
    <button class="hbtn" id="cfgBtn" title="Ajustes">⚙️</button>
  </div>
</header>

<div class="app">
  <!-- ================= COLUMNA IZQUIERDA: BÚSQUEDA ================= -->
  <main class="pane-list">
    <div class="searchbar">
      <div class="searchbar-wrap">
        <input id="q" type="search" inputmode="search" autocomplete="off" autofocus
               placeholder="Buscar producto o escanear código…">
        <button class="scanbtn" id="openScan"><span>📷</span><small>Escanear</small></button>
      </div>
    </div>
    <div class="toolrow">
      <span class="count" id="count"></span>
      <button class="minibtn" id="newProdBtn">＋ Producto</button>
      <button class="minibtn" id="cajaBtn">📊 Hoy</button>
    </div>
    <div id="list"></div>
  </main>

  <!-- ================= COLUMNA DERECHA: CANASTA (siempre visible) ================= -->
  <aside class="pane-cart" id="paneCart">
    <div class="cart-head">
      <h2>🧾 Cuenta del cliente</h2>
      <span class="cc" id="cartCount">0</span>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="subrow" id="subrow"></div>
      <div class="totalrow"><span class="t-lbl">TOTAL</span><span class="t-val" id="cartTotal">$0.00</span></div>

      <!-- este bloque se mueve a una hoja en celular -->
      <div id="payBox" class="payinline">
        <div class="descrow">
          <span class="d-lbl">Descuento</span>
          <div class="dgroup">
            <button class="dtipo activo" id="dPesos" type="button">$</button>
            <button class="dtipo" id="dPct" type="button">%</button>
            <input id="descVal" type="number" inputmode="decimal" placeholder="0" min="0">
          </div>
        </div>
        <div class="formas" id="formas">
          <button class="forma activo" data-forma="efectivo">💵 Efectivo</button>
          <button class="forma" data-forma="transferencia">📲 Transfer.</button>
          <button class="forma" data-forma="tarjeta">💳 Tarjeta</button>
          <button class="forma" data-forma="credito">🤝 Fiado</button>
        </div>
        <div id="cliRow" class="clirow" style="display:none">
          <span id="cliNombre">Sin cliente</span>
          <button class="minibtn" id="pickCli">Elegir cliente</button>
        </div>
        <div class="pago" id="pagoRow">
          <label>¿Con cuánto paga?</label>
          <input id="paga" type="number" inputmode="decimal" placeholder="$">
        </div>
        <div class="cambio" id="cambio"></div>
        <div class="foot-btns">
          <button class="btn-clear" id="clearCart" title="Cancelar venta">🗑</button>
          <button class="btn-apart" id="apartarBtn">🎁 Apartar</button>
          <button class="btn-done" id="doneCart">✓ Cobrado<span class="kbd">F12</span></button>
        </div>
      </div>

      <button id="cobrarMovil">💵 Cobrar</button>
    </div>
  </aside>
</div>

<!-- Hoja de cobro (solo en celular) -->
<div id="paySheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head">
      <h2>💵 Cobrar <span id="payTotal" style="color:#0d6e5a"></span></h2>
      <button class="closex" data-close="paySheet">✕</button>
    </div>
    <div class="sheet-body" id="paySheetBody"></div>
  </div>
</div>

<!-- Venta cobrada -->
<div id="okSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2>✅ Venta cobrada</h2><button class="closex" data-close="okSheet">✕</button></div>
    <div class="sheet-body" id="okBody"></div>
    <div class="sheet-foot">
      <div class="btnrow">
        <button class="b-save" id="ticketBtn">📄 Ticket para WhatsApp</button>
        <button class="b-rest" id="okListo">Listo</button>
      </div>
    </div>
  </div>
</div>

<!-- Menú Más -->
<div id="menuSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2>☰ Más</h2><button class="closex" data-close="menuSheet">✕</button></div>
    <div class="sheet-body" id="menuBody"></div>
  </div>
</div>

<!-- Panel genérico -->
<div id="panelSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head">
      <button class="closex" id="panelBack" style="display:none">‹</button>
      <h2 id="panelTitle">—</h2>
      <button class="closex" data-close="panelSheet">✕</button>
    </div>
    <div class="sheet-body" id="panelBody"></div>
    <div class="sheet-foot" id="panelFoot" style="display:none"></div>
  </div>
</div>

<!-- Corte del día -->
<div id="cajaSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2>📊 Ventas de hoy</h2><button class="closex" data-close="cajaSheet">✕</button></div>
    <div class="sheet-body" id="cajaBody"></div>
  </div>
</div>

<!-- Editar / Nuevo producto -->
<div id="editSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2 id="editTitle">✏️ Editar producto</h2><button class="closex" data-close="editSheet">✕</button></div>
    <div class="sheet-body">
      <div id="editNote"></div>
      <div class="field"><label>Nombre del producto</label><input id="f_n" type="text"></div>
      <div class="field" id="wrap_c"><label>Código (de barras o clave tuya)</label><input id="f_c" type="text"></div>
      <div class="f2">
        <div class="field"><label>Precio de venta</label><input id="f_v" type="number" inputmode="decimal" step="0.01"></div>
        <div class="field"><label>Precio mayoreo</label><input id="f_m" type="number" inputmode="decimal" step="0.01"></div>
      </div>
      <div class="f2">
        <div class="field"><label>Costo (lo que te costó)</label><input id="f_co" type="number" inputmode="decimal" step="0.01"></div>
        <div class="field"><label>Piezas que quedan</label><input id="f_e" type="number" inputmode="decimal" step="1"></div>
      </div>
      <div class="field"><label>Departamento</label><input id="f_d" type="text"></div>
    </div>
    <div class="sheet-foot">
      <div class="btnrow">
        <button class="b-save" id="saveProd">✓ Guardar</button>
        <button class="b-rest" id="restProd">↩ Original</button>
        <button class="b-del" id="delProd">🗑 Borrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Ajustes -->
<div id="cfgSheet" class="sheetwrap">
  <div class="sheet">
    <div class="sheet-head"><h2>⚙️ Ajustes</h2><button class="closex" data-close="cfgSheet">✕</button></div>
    <div class="sheet-body" id="cfgBody"></div>
  </div>
</div>

<!-- Escáner -->
<div id="scanView">
  <div class="scan-top"><h2>📷 Escanea el código</h2><button class="closex" id="closeScan" style="background:#fff;">✕</button></div>
  <div id="reader"></div>
  <div class="scan-msg" id="scanMsg">Apunta al código de barras</div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="html5-qrcode.min.js"></script>
<script src="jspdf.min.js"></script>
<script src="ticket.js"></script>
<script src="app.js"></script>
<script src="mas.js"></script>
</body>
</html>
